name: Build Downloader database

on:
  push:
    branches: [main]
    paths:
      - 'Scripts/**'
      - 'tools/*/files.txt'
      - 'build/**'
      - '.github/workflows/db.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: db
  cancel-in-progress: false

jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build db.json.zip
        run: python build/build_db.py --sha "$GITHUB_SHA" --out dist/db.json.zip

      - name: Publish to the db branch
        run: |
          cd dist
          git init -q -b db
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db.json.zip
          git commit -q -m "Database for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" db
